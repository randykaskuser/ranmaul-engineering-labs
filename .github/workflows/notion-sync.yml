name: Notion → MDX Sync

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Run sync (write)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run notion:sync

      - name: Commit changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "notion-sync-bot"
            git config user.email "notion-sync-bot@users.noreply.github.com"
            # Hardening (Phase 3.7): minimize blast radius of a write-capable workflow.
            # Only stage the generated content and downloaded media outputs.
            # Stage generated content. Only add media directory if it exists to avoid pathspec errors.
            git add -A content
            if [ -d public/media/notion ]; then
              git add -A public/media/notion
            fi
            git commit -m "chore(content): sync Notion → MDX"
            git push
          else
            echo "No changes to commit."
          fi
